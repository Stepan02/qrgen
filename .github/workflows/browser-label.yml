name: Add Label to Browser Issues

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  add-label:
    runs-on: ubuntu-latest
    steps:
      - name: Auto-label browser issue
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const content = `${issue.title} ${issue.body || ''}`.toLowerCase();
            const keywords = ['browser', 'safari', 'chrome', 'firefox', 'edge'];
            
            if (keywords.some(word => content.includes(word))) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ["browser-support"]
              });
              console.log(`#${issue.number} is a browser-related issue`);
            }
